<style>
/* Passion Events — standalone grand launch page. Self-contained: no site CSS. */
@font-face{font-family:"PE Cormorant";src:url(/launch-assets/fonts/cormorant-garamond-latin.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}
@font-face{font-family:"PE Cormorant";src:url(/launch-assets/fonts/cormorant-garamond-italic-latin.woff2) format("woff2");font-weight:300 700;font-style:italic;font-display:swap}
@font-face{font-family:"PE Manrope";src:url(/launch-assets/fonts/manrope-latin.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"PE Script";src:url(/launch-assets/fonts/mrs-saint-delafield-latin.woff2) format("woff2");font-display:swap}

:root{
  --ivory:#FFF9EF;--cream:#F8F0E5;--rose:#C98D99;--blush:#E9BEC4;--coral:#F18A68;--mint:#9CCFC0;--green:#315F51;--ink:#171311;--gold:#D9B572;
  --ease:cubic-bezier(.22,1,.36,1);
  --h50:50vh;
  --ring:min(84vh,92vw);
  --btn-h:clamp(66px,11vh,112px);
  --logo:min(36vh,400px,calc(var(--ring)*.46));
  --big:min(40vmin,470px);
  --sprig:min(25vmin,300px);
}
@supports (height:1svh){:root{--h50:50svh}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ivory);color:var(--ink)}
body{font-family:"PE Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
.glow{position:absolute;pointer-events:none}
.glow-base{inset:0;background:radial-gradient(120% 90% at 50% 46%,#FFFDF8 0%,var(--ivory) 46%,var(--cream) 100%)}
.glow-rose{left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;
  background:radial-gradient(circle,rgba(233,190,196,.5) 0%,rgba(233,190,196,.2) 26%,rgba(255,249,239,0) 52%);
  animation:roseSpread 3s var(--ease) .15s backwards,breathe 10s ease-in-out 3.2s infinite}
.glow-coral{right:-22vmax;top:-24vmax;width:72vmax;height:72vmax;background:radial-gradient(circle,rgba(241,138,104,.2),rgba(241,138,104,0) 62%);
  animation:fadeIn 2.4s ease .3s backwards,drift 17s ease-in-out 2.7s infinite alternate}
.glow-mint{left:-24vmax;bottom:-26vmax;width:74vmax;height:74vmax;background:radial-gradient(circle,rgba(156,207,192,.3),rgba(156,207,192,0) 62%);
  animation:fadeIn 2.4s ease .5s backwards,drift 19s ease-in-out 2.9s infinite alternate-reverse}

/* ---------- botanical corners ---------- */
.branch{position:absolute;pointer-events:none;z-index:1;transition:opacity .8s ease,scale 1.1s var(--ease)}
.branch svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:0 0;animation:sway 10s ease-in-out 3.2s infinite alternate}
.b-big{width:var(--big)}
.b-sprig{width:var(--sprig)}
.b1{left:0;top:0}
.b2{right:0;bottom:0;transform:rotate(180deg)}
.s1{right:0;top:0;transform:scaleX(-1)}
.s2{left:0;bottom:0;transform:scaleY(-1)}
.stem{fill:none;stroke:#5E9C89;stroke-width:1.15;stroke-linecap:round;stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.45,0,.2,1) var(--d,0s) backwards}
.lf{fill:var(--mint);fill-opacity:.9;stroke:#5E9C89;stroke-width:.6}
.lo{fill:#FFF9EF;fill-opacity:.6;stroke:#6FAF9C;stroke-width:.75}
.rib{fill:none;stroke:#4E8A78;stroke-width:.45;stroke-linecap:round;opacity:.75}
.leaf{transform-box:fill-box;transform-origin:0% 50%;animation:leafIn .9s var(--ease) var(--d,0s) backwards}
.bloom{transform-box:fill-box;transform-origin:50% 50%;animation:bloomIn 1.1s cubic-bezier(.34,1.56,.64,1) var(--d,0s) backwards}
.pt{fill:var(--coral);stroke:#E27350;stroke-width:.35}
.ph{fill:#F8B39C;opacity:.75}
.ctr{fill:#D9628F}
.dot{fill:#5E2650}
.bd{fill:var(--blush);stroke:var(--rose);stroke-width:.4}
.sp{fill:none;stroke:#5E9C89;stroke-width:.8;stroke-linecap:round}

/* ---------- the floral ring ---------- */
.ring{position:absolute;left:50%;top:50%;width:var(--ring);height:var(--ring);translate:-50% -50%;overflow:visible;z-index:2;pointer-events:none}
.ring .line{fill:none;stroke:url(#roseGold);stroke-width:.55;stroke-dasharray:1;animation:draw 1.7s var(--ease) var(--d,1.2s) backwards}
.ring .line.thin{stroke-width:.32}
.ring .dots{fill:none;stroke:var(--gold);stroke-width:.55;stroke-dasharray:.35 3.2;stroke-linecap:round;opacity:.75;transform-box:view-box;transform-origin:100px 100px;animation:fadeIn 1.4s ease 2.2s backwards,spin 90s linear 2.2s infinite}

/* ---------- petals & gold particles ---------- */
.petals,.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3;transition:opacity .5s ease}
.petal{position:absolute;top:-6vh;left:var(--x);width:var(--s);height:calc(var(--s)*1.3);border-radius:80% 0 80% 0;opacity:0;
  background:linear-gradient(135deg,#F7D8DB 0%,#E9BEC4 48%,#C98D99 100%);
  animation:petal var(--t) linear var(--d) infinite;will-change:transform}
.petal.c{background:linear-gradient(135deg,#FCCBB9 0%,#F6A07F 55%,#F18A68 100%)}
.petal.m{border-radius:100% 0 100% 0;background:linear-gradient(135deg,#CFE9E0,#9CCFC0 60%,#6FAF9C)}
.spark{position:absolute;left:var(--x);top:var(--y);width:3px;height:3px;border-radius:50%;background:#E8C987;box-shadow:0 0 7px 1px rgba(232,201,135,.8);opacity:0;
  animation:twinkle var(--t) ease-in-out var(--d) infinite}

/* ---------- identity ---------- */
.logo{position:absolute;left:50%;bottom:calc(50% + var(--btn-h)/2 + 2.4vh);height:var(--logo);width:auto;aspect-ratio:640/642;translate:-50% 0;z-index:4;
  animation:logoIn 1.5s var(--ease) .95s backwards;transition:opacity .35s ease}
.tagline{position:absolute;left:50%;top:calc(50% + var(--btn-h)/2 + 3vh);translate:-50% 0;margin:0;z-index:4;white-space:nowrap;
  font-size:clamp(10px,.82vw,13px);font-weight:500;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#8C7072;
  animation:tagIn 1.5s var(--ease) 2.2s backwards;transition:opacity .35s ease}

/* ---------- THE launch button ---------- */
.launch{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:6;display:inline-flex;align-items:center;gap:clamp(18px,2vw,34px);
  height:var(--btn-h);padding:0 calc(var(--btn-h)*.11) 0 clamp(26px,3.3vw,52px);border-radius:999px;white-space:nowrap;
  color:var(--ink);text-decoration:none;cursor:pointer;outline:none;
  background:linear-gradient(180deg,#FFFEFB 0%,#FFF7EC 100%);border:1.5px solid rgba(201,141,153,.6);
  box-shadow:0 0 0 7px rgba(255,249,239,.62),0 0 0 8px rgba(201,141,153,.2),0 34px 80px -30px rgba(126,62,78,.55),0 10px 24px -14px rgba(126,62,78,.35),inset 0 1px 0 #fff;
  transition:transform .65s var(--ease),box-shadow .65s var(--ease);
  animation:btnIn 1.15s var(--ease) 1.8s backwards}
.launch::before{content:"";position:absolute;inset:-11px;border-radius:inherit;border:1px solid rgba(201,141,153,.5);pointer-events:none;
  animation:halo 3.4s ease-out 3.1s infinite;opacity:0}
.launch-sweep{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.launch-sweep::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-45%;width:38%;transform:skewX(-20deg) translateX(0);
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(233,190,196,.5) 35%,rgba(255,255,255,.85) 50%,rgba(241,138,104,.22) 65%,rgba(255,255,255,0))}
.launch-text{position:relative;display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.launch-eyebrow{font-size:clamp(9px,.74vw,12px);font-weight:600;letter-spacing:.36em;text-transform:uppercase;color:var(--rose);margin-bottom:.6em;transition:color .6s ease}
.launch-main{font-family:"PE Cormorant",Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(30px,3.7vw,62px);letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;transition:letter-spacing .7s var(--ease),color .6s ease}
.launch-arrow{position:relative;flex:none;display:grid;place-items:center;width:calc(var(--btn-h) - 22px);height:calc(var(--btn-h) - 22px);border-radius:50%;
  background:var(--ink);color:var(--ivory);transition:transform .65s var(--ease),background-color .6s ease}
.launch-arrow svg{width:38%;height:38%;transition:transform .65s var(--ease)}
.launch-flower{position:absolute;left:calc(var(--btn-h)*.18);top:calc(var(--btn-h)*-.2);width:calc(var(--btn-h)*.42);height:auto;opacity:0;transform:scale(.3) rotate(-60deg);
  transition:opacity .5s ease,transform .8s cubic-bezier(.34,1.56,.64,1);pointer-events:none;overflow:visible}
@media (hover:hover){
  .launch:hover{transform:scale(1.035);box-shadow:0 0 0 7px rgba(255,249,239,.7),0 0 0 8px rgba(201,141,153,.35),0 0 70px 6px rgba(233,190,196,.75),0 40px 90px -30px rgba(126,62,78,.6),inset 0 1px 0 #fff}
  .launch:hover .launch-sweep::after{animation:sweep 1.05s var(--ease)}
  .launch:hover .launch-main{letter-spacing:.4em;margin-right:-.4em;color:#2B1D1B}
  .launch:hover .launch-eyebrow{color:#B8707F}
  .launch:hover .launch-arrow{background-color:#3A2427}
  .launch:hover .launch-arrow svg{transform:translateX(18%)}
  .launch:hover .launch-flower{opacity:1;transform:scale(1) rotate(0)}
}
.launch:focus-visible{box-shadow:0 0 0 7px rgba(255,249,239,.7),0 0 0 9.5px var(--rose),0 34px 80px -30px rgba(126,62,78,.55)}
.launch:focus-visible .launch-flower{opacity:1;transform:scale(1) rotate(0)}
.launch:active{transform:scale(.985)}

/* ---------- optional sound ---------- */
.sound{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:20;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;
  border-radius:999px;border:1px solid rgba(201,141,153,.45);background:rgba(255,249,239,.88);color:#6E5557;cursor:pointer;
  font:600 10.5px/1 "PE Manrope",system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;
  animation:fadeIn 1s ease 2.7s backwards;transition:opacity .35s ease,border-color .3s ease,color .3s ease}
.sound:hover,.sound:focus-visible{border-color:var(--rose);color:var(--ink);outline:none}
.sound:focus-visible{box-shadow:0 0 0 2px var(--rose)}
.sound svg{width:16px;height:16px}
.sound .waves{opacity:0;transition:opacity .3s ease}
.sound[aria-pressed="true"] .waves{opacity:1}
.sound[aria-pressed="true"] .mute{opacity:0}
.sound[hidden]{display:none}

/* ---------- the launch transition (curtains) ---------- */
.veil{position:fixed;inset:0;z-index:30;pointer-events:none;visibility:hidden}
.veil::before{content:"";position:absolute;inset:0;background:var(--ivory);opacity:0}
.curtains{position:absolute;inset:0;clip-path:circle(0% at 50% 50%)}
.curtain{position:absolute;top:0;bottom:0;width:50.4%}
.curtain-l{left:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.09) 34px,rgba(120,48,66,.045) 72px,rgba(255,255,255,0) 110px),radial-gradient(circle at 100% 50%,#FFF6EF 0%,#F7DDDF 22%,#EDC6CB 42%,#DDA7B1 68%,#C98D99 100%)}
.curtain-r{right:0;background:repeating-linear-gradient(270deg,rgba(255,255,255,0) 0,rgba(255,255,255,.09) 34px,rgba(120,48,66,.045) 72px,rgba(255,255,255,0) 110px),radial-gradient(circle at 0% 50%,#FFF6EF 0%,#F7DDDF 22%,#EDC6CB 42%,#DDA7B1 68%,#C98D99 100%)}
.curtain-l::after,.curtain-r::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(rgba(217,181,114,0),rgba(217,181,114,.85),rgba(217,181,114,0))}
.curtain-l::after{right:0}.curtain-r::after{left:0}
.medallion{position:absolute;left:50%;top:50%;width:min(58vmin,400px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.85);
  background:radial-gradient(circle,#FFFDF8 0%,#FFF9EF 62%,#F8EEE4 100%);box-shadow:0 0 0 1px rgba(201,141,153,.35),0 0 0 10px rgba(255,249,239,.5),0 50px 110px -45px rgba(126,62,78,.6)}
.medallion img{width:88%;height:auto}

.is-launching .veil{visibility:visible;pointer-events:auto}
.is-launching .veil::before{animation:show .01s linear 1s forwards}
.is-launching .curtains{animation:bloomOpen .85s cubic-bezier(.65,0,.35,1) .15s forwards}
.is-launching .curtain-l{animation:curtainL .8s cubic-bezier(.7,0,.25,1) 1.32s forwards}
.is-launching .curtain-r{animation:curtainR .8s cubic-bezier(.7,0,.25,1) 1.32s forwards}
.is-launching .medallion{animation:medIn .75s var(--ease) .75s forwards}
.is-launching .launch{animation:press .7s var(--ease) forwards;pointer-events:none}
.is-launching .launch-main{letter-spacing:.55em}
.is-launching .ring{animation:ringOut 1.05s cubic-bezier(.55,0,.75,.2) .05s forwards}
.is-launching .branch{opacity:0;scale:1.18}
.is-launching .logo,.is-launching .tagline,.is-launching .sound,.is-launching .petals,.is-launching .sparkles{opacity:0}

/* ---------- keyframes ---------- */
@keyframes fadeIn{from{opacity:0}}
@keyframes show{to{opacity:1}}
@keyframes roseSpread{0%{opacity:0;transform:scale(.3)}45%{opacity:.55}100%{opacity:1;transform:scale(1)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes drift{to{transform:translate3d(-4vmax,3vmax,0)}}
@keyframes sway{to{transform:rotate(1.3deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes leafIn{from{opacity:0;transform:scale(0) rotate(-28deg)}}
@keyframes bloomIn{from{opacity:0;transform:scale(0) rotate(-70deg)}60%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes petal{0%{opacity:0;transform:translate3d(0,0,0) rotate(var(--r))}9%{opacity:.85}30%{transform:translate3d(calc(var(--dx)*.3 + 3vw),32vh,0) rotate(calc(var(--r) + 120deg))}
  60%{transform:translate3d(calc(var(--dx)*.65 - 3vw),64vh,0) rotate(calc(var(--r) + 250deg))}90%{opacity:.7}100%{opacity:0;transform:translate3d(var(--dx),112vh,0) rotate(calc(var(--r) + 400deg))}}
@keyframes twinkle{0%,100%{opacity:0;transform:translateY(0) scale(.5)}50%{opacity:.95;transform:translateY(-12px) scale(1)}}
@keyframes logoIn{from{opacity:0;clip-path:circle(6% at 50% 50%);transform:scale(1.06)}to{opacity:1;clip-path:circle(72% at 50% 50%);transform:none}}
@keyframes tagIn{from{opacity:0;letter-spacing:.95em}}
@keyframes tagInSm{from{opacity:0;letter-spacing:.55em}}
@keyframes btnIn{from{opacity:0;transform:scale(.88) translateY(16px)}}
@keyframes halo{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.08,1.4)}}
@keyframes sweep{from{transform:skewX(-20deg) translateX(0)}to{transform:skewX(-20deg) translateX(420%)}}
@keyframes bloomOpen{to{clip-path:circle(75% at 50% 50%)}}
@keyframes curtainL{to{transform:translateX(-101%)}}
@keyframes curtainR{to{transform:translateX(101%)}}
@keyframes medIn{to{opacity:1;transform:none}}
@keyframes press{0%{transform:scale(1)}28%{transform:scale(.95)}100%{transform:scale(1.14);opacity:0}}
@keyframes ringOut{to{transform:scale(2.3);opacity:0}}

/* ---------- phones & portrait tablets: their own composition ---------- */
@media (max-aspect-ratio:4/5){
  :root{
    --ring:min(86vw,58vh);
    --btn-h:clamp(70px,8.6vh,96px);
    --logo:min(240px,calc((var(--h50) - var(--ring)/2 - 24px)*1.12));
    --big:min(45vw,calc(var(--h50) - var(--ring)/2 + 16px),400px);
    --sprig:min(28vw,190px);
  }
  @supports (height:1svh){:root{--ring:min(86vw,58svh);--btn-h:clamp(70px,8.6svh,96px)}}
  .logo{bottom:calc(50% + var(--ring)/2 - var(--logo)*.08)}
  .tagline{top:calc(50% + var(--btn-h)/2 + 2.2vh);font-size:clamp(9.5px,2.6vw,13px);letter-spacing:.32em;padding-left:.32em;animation-name:tagInSm}
  .s1{left:0;right:auto;top:0;bottom:auto;transform:none}
  .s2{right:0;left:auto;top:0;bottom:auto;transform:scaleX(-1)}
  .b1{left:0;top:auto;bottom:0;transform:scaleY(-1)}
  .b2{right:0;bottom:0;transform:rotate(180deg)}
  .launch{padding-left:clamp(22px,5.4vw,40px)}
  .launch-main{font-size:clamp(28px,8.4vw,46px);letter-spacing:.28em;margin-right:-.28em}
  .launch-eyebrow{font-size:clamp(8.5px,2.3vw,11px);letter-spacing:.3em}
  .petal:nth-child(n+9),.spark:nth-child(n+11){display:none}
}
@media (max-aspect-ratio:4/5) and (hover:hover){.launch:hover .launch-main{letter-spacing:.34em;margin-right:-.34em}}
@media (max-width:350px){
  :root{--btn-h:64px}
  .launch{gap:10px;padding-left:18px}
  .launch-main{font-size:26px;letter-spacing:.22em;margin-right:-.22em}
  .launch-eyebrow{letter-spacing:.22em}
  .tagline{letter-spacing:.24em}
}

/* ---------- reduced motion: the composition, still ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .petals,.sparkles,.launch::before{display:none}
}
</style>
</head>
<body>
<main class="stage" aria-labelledby="launch-title">
  <h1 id="launch-title" class="sr-only">Passion Events — the grand launch</h1>

  <div class="glow glow-base" aria-hidden="true"></div>
  <div class="glow glow-rose" aria-hidden="true"></div>

<script>
/* Passion Events launch: the click transition, then a normal full-page
   navigation to the homepage. Everything else is CSS, so the page (and the
   plain link) still works if this script never runs. */
(function () {
  var root = document.documentElement;
  var link = document.querySelector(".launch");
  var reduce = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  var launching = false;

  /* ---- optional sound: an original ambient chord + chimes, synthesised in the browser (off by default) ---- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var soundBtn = document.querySelector(".sound");
  var label = soundBtn && soundBtn.querySelector(".sound-label");
  var ctx = null, master = null, on = false, chimeTimer = 0;
  var SCALE = [587.33, 659.25, 739.99, 880, 987.77, 1174.66]; // D major pentatonic

  function build() {
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    var lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1500;
    lp.connect(master); master.connect(ctx.destination);
    [146.83, 220, 277.18, 369.99, 554.37].forEach(function (freq, i) { // D · A · C# · F# · C#  (Dmaj7)
      var o = ctx.createOscillator(); o.type = i % 2 ? "triangle" : "sine"; o.frequency.value = freq; o.detune.value = (i - 2) * 3;
      var g = ctx.createGain(); g.gain.value = 0.085 / (1 + i * 0.4);
      var lfo = ctx.createOscillator(); lfo.frequency.value = 0.06 + i * 0.027;
      var depth = ctx.createGain(); depth.gain.value = g.gain.value * 0.45;
      lfo.connect(depth); depth.connect(g.gain); o.connect(g); g.connect(lp);
      o.start(); lfo.start();
    });
  }
  function chime(freq, when, vol, dur) {
    var o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq; o2.type = "sine"; o2.frequency.value = freq * 2.005; g2.gain.value = 0.22;
    g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(vol, when + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    o.start(when); o2.start(when); o.stop(when + dur + 0.1); o2.stop(when + dur + 0.1);
  }
  function loopChimes() {
    if (!on) return;
    chime(SCALE[Math.floor(Math.random() * SCALE.length)], ctx.currentTime + 0.05, 0.05, 2.8);
    chimeTimer = window.setTimeout(loopChimes, 2800 + Math.random() * 2600);
  }
  function setSound(next) {
    on = next;
    soundBtn.setAttribute("aria-pressed", String(on));
    label.textContent = on ? "Sound on" : "Sound off";
    if (on) {
      if (!ctx) build();
      ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0.9, ctx.currentTime, 1.1);
      window.clearTimeout(chimeTimer); chimeTimer = window.setTimeout(loopChimes, 900);
    } else if (ctx) {
      window.clearTimeout(chimeTimer);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.35);
      window.setTimeout(function () { if (!on) ctx.suspend(); }, 1600);
    }
  }
  if (AC && soundBtn) {
    soundBtn.hidden = false;
    soundBtn.addEventListener("click", function () { setSound(!on); });
    document.addEventListener("visibilitychange", function () {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else if (on) ctx.resume();
    });
  }

  /* ---- the launch ---- */
  if (!link) return;
  link.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // new tab etc.: let the browser handle it
    e.preventDefault();
    if (launching) return;
    launching = true;
    var href = link.href; // the main homepage
    root.classList.add("is-launching");
    if (on && ctx) {
      var t = ctx.currentTime;
      [587.33, 739.99, 880, 1174.66, 1479.98].forEach(function (freq, i) { chime(freq, t + 0.08 + i * 0.13, 0.09, 3); });
      master.gain.setTargetAtTime(0, t + 1.5, 0.2);
    }
    window.setTimeout(function () { window.location.assign(href); }, reduce.matches ? 380 : 2150);
  });
  // Coming back with the Back button (page restored from the cache): show the composition again.
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) { root.classList.remove("is-launching"); launching = false; }
  });
})();
</script>
